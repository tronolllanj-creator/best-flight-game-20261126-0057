<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aeris: Ridge Runner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0a0c10; color: #eaf2f7; font-family: system-ui, sans-serif; overflow: hidden; }
    #wrap { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    canvas { display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
    #status { margin-top: 8px; font-size: 12px; color: #9ab0c0; text-align: center; min-height: 16px; width: 1280px; max-width: 100%; padding: 0 8px; }
    @media (max-width: 1300px) { canvas { width: 100vw; height: auto; } #status { width: 100vw; } }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="status">Loading...</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
